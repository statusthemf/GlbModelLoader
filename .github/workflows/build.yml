
name: Build ULTRADROID Models API and Example

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check game reference assemblies
        shell: bash
        run: |
          required=(
            Assembly-CSharp.dll
            Il2Cppmscorlib.dll
            UnityEngine.CoreModule.dll
            UnityEngine.ImageConversionModule.dll
            UnityEngine.PhysicsModule.dll
          )

          missing=0

          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required game assembly: $file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "One or more required game assemblies are missing from the repository root."
            exit 1
          fi

      - name: Restore API and example
        run: >
          dotnet restore examples/ExampleMod.csproj
          --source https://api.nuget.org/v3/index.json
          --source https://nuget.bepinex.dev/v3/index.json

      - name: Build API
        run: >
          dotnet build ULTRADROID.Models.csproj
          --configuration Release
          --no-restore

      - name: Build example mod
        run: >
          dotnet build examples/ExampleMod.csproj
          --configuration Release
          --no-restore

      - name: Upload API and example DLLs
        uses: actions/upload-artifact@v4
        with:
          name: ULTRADROID-Models-and-Example-net10
          path: |
            bin/Release/net10.0/ULTRADROID.Models.dll
            examples/bin/Release/net10.0/ExampleMod.dll
          if-no-files-found: error
