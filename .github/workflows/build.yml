name: Build ULTRADROID Models API

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check game reference assemblies
        shell: bash
        run: |
          required=(
            Assembly-CSharp.dll
            Il2Cppmscorlib.dll
            UnityEngine.CoreModule.dll
            UnityEngine.ImageConversionModule.dll
            UnityEngine.PhysicsModule.dll
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required target-game reference: $file"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Add the exact DLLs from the target ULTRAKILL build to the repository root (or update the HintPath values in the csproj). Do not use DLLs from a different Unity build."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore ULTRADROID.Models.csproj

      - name: Build Release
        run: dotnet build ULTRADROID.Models.csproj --configuration Release --no-restore

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: ULTRADROID-Models-net10
          path: bin/Release/net10.0/ULTRADROID.Models.dll
          if-no-files-found: error
