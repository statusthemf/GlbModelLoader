
      - name: Check ULTRADROID dependencies
        run: |
          for file in ULTRADROID.API.dll ULTRADROID.Core.dll; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required dependency: $file"
              exit 1
            fi
          done

      - name: Restore example and API
        run: |
          dotnet restore examples/ExampleMod.csproj \
            --source https://api.nuget.org/v3/index.json \
            --source https://nuget.bepinex.dev/v3/index.json

      - name: Build API and weapon plugin
        run: |
          dotnet build examples/ExampleMod.csproj \
            --configuration Release \
            --no-restore

      - name: Verify output DLLs
        run: |
          test -f bin/Release/net10.0/ULTRADROID.Models.dll
          test -f examples/bin/Release/net10.0/WeaponModExample.dll
          test -f ULTRADROID.API.dll
          test -f ULTRADROID.Core.dll

          echo "Build outputs:"
          ls -lh bin/Release/net10.0/ULTRADROID.Models.dll
          ls -lh examples/bin/Release/net10.0/WeaponModExample.dll
          ls -lh ULTRADROID.API.dll
          ls -lh ULTRADROID.Core.dll

      - name: Upload plugins and dependencies
        uses: actions/upload-artifact@v4
        with:
          name: ULTRADROID-Plugins
          path: |
            bin/Release/net10.0/ULTRADROID.Models.dll
            examples/bin/Release/net10.0/WeaponModExample.dll
            ULTRADROID.API.dll
            ULTRADROID.Core.dll
          if-no-files-found: error
